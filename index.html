<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="july Daniela Riaño Soto">
  <meta name="description" content="PROYECTO19">
  <title>Mi Cliente de Usuarios</title>

  <link rel="stylesheet" href="pagina.css">
</head>

<body>

  <header>
    <h1>Mi cliente de usuarios 🌸</h1>
  </header>

  <div id="tablero">

    <div id="carriles"></div>

    <div id="zona-agregar">
      <button id="btn-mas" type="button">+</button>
    </div>
  </div>

  <div id="modal" class="oculto">
    <form id="formulario">
      <label for="numero-usuario">Escribe el número de usuario (del 1 al 10)</label>
      <input type="text" id="numero-usuario" placeholder="ejemplo: 1">

      <p id="mensaje-error"></p>

      <button type="submit" class="btn-principal">Añadir usuario</button>
      <button type="button" id="btn-cancelar" class="btn-secundario">Cancelar</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
